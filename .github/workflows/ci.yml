name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Mods are an early-access API: run against the newest Claude Code every day
  # so a breaking release shows up here before it shows up in an issue.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate and test the mod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Install the latest Claude Code
        run: npm install -g @anthropic-ai/claude-code && claude --version

      - name: Version, changelog and tag agree
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$version] section"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [[ "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "Tag ${GITHUB_REF#refs/tags/} does not match plugin.json version $version"; exit 1
          fi

      - name: Validate the manifest, marketplace and hooks module
        run: claude plugin validate .

      - name: Run the tests (no session, sign-in or network)
        run: claude plugin test .
